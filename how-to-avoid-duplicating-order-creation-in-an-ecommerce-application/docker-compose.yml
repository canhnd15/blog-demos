services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_demo
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orders -d order_demo']
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 20
